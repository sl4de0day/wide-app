name: Wide App CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Typecheck, Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Renderer Typecheck
        run: npm run typecheck

      - name: Build Renderer
        run: npm run build:renderer

      - name: Build Backend
        run: npm run build:backend

      - name: Unit & Smoke Tests
        run: npm test

  sync-to-ide:
    name: Sync Shared Files to wide-ide
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout wide-app
        uses: actions/checkout@v7
        with:
          repository: sl4de0day/wide-app
          path: wide-app

      - name: Checkout wide-ide
        uses: actions/checkout@v7
        with:
          repository: sl4de0day/wide-ide
          path: wide-ide
          token: ${{ secrets.WIDE_ECOSYSTEM_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Sync Shared Files
        run: node wide-app/scripts/sync-shared.cjs --from current --apply

      - name: Commit and Push Shared File Updates to wide-ide
        working-directory: wide-ide
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No shared file differences detected."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: sync shared files from wide-app"
          git push origin main
