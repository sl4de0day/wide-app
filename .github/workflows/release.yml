name: Wide App Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-linux:
    name: Build & Package Linux Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Linux Packaging Tools
        run: sudo apt-get update && sudo apt-get install -y zstd squashfs-tools-ng

      - name: Install dependencies
        run: npm install

      - name: Build Renderer & Backend
        run: npm run build:linux

      - name: Package Linux Archives, DEB & AppImage
        run: |
          npm run package:linux
          npm run package:deb
          if [ -f resources/appimage-runtime-x86_64 ]; then
            npm run package:appimage
          fi
          npm run checksums

      - name: Upload Linux Release Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: wide-app-linux-release
          path: |
            release/*.tar.gz
            release/*.tar.zst
            release/*.deb
            release/*.AppImage
            release/SHA256SUMS

      - name: Publish Linux Assets to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          shopt -s nullglob
          ASSETS=(release/*.tar.gz release/*.tar.zst release/*.deb release/*.AppImage release/SHA256SUMS)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            gh release create "$TAG" "${ASSETS[@]}" --title "Wide App $TAG" --generate-notes
          fi

  release-windows:
    name: Build & Package Windows Release
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build Renderer & Backend
        run: npm run build:linux

      - name: Package Windows Installer
        run: npm run package:win

      - name: Upload Windows Release Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: wide-app-windows-release
          path: |
            release/*.exe
            release/*.zip

      - name: Publish Windows Assets to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          shopt -s nullglob
          ASSETS=(release/*.exe release/*.zip)
          if [ ${#ASSETS[@]} -gt 0 ]; then
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release upload "$TAG" "${ASSETS[@]}" --clobber
            else
              gh release create "$TAG" "${ASSETS[@]}" --title "Wide App $TAG" --generate-notes
            fi
          fi

  finalize-checksums:
    name: Publish Combined SHA256SUMS
    needs: [release-linux, release-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Generate and Upload Combined SHA256SUMS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          mkdir -p merged
          gh release download "$TAG" -R "$REPO" -D merged --clobber
          rm -f merged/SHA256SUMS
          (cd merged && LC_ALL=C sha256sum * | sort > SHA256SUMS)
          cat merged/SHA256SUMS
          gh release upload "$TAG" merged/SHA256SUMS -R "$REPO" --clobber
